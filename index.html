<script>window.NUTRITION_NOTES = "\u003ch2>Food first. Less fuss.\u003c/h2>\n\u003cp>Use these ideas to find food you enjoy and can actually manage. This is a starting menu, \u003cb>not a daily food limit\u003c/b>. Add portions, meals or snacks to suit hunger and needs.\u003c/p>\n\u003cp>A varied diet includes protein foods, grains or other carbohydrate foods, fruit/vegetables, dairy or suitable fortified alternatives and fats. You do not need a perfect diet to breastfeed. \u003ca href=\"https://www.breastfeeding.asn.au/resources/breastfeeding-your-diet\" target=\"_blank\" rel=\"noopener\">Australian Breastfeeding Association guidance\u003c/a>.\u003c/p>\n\u003ch3>Read the prep line\u003c/h3>\n\u003cp>\u201cHands-on\u201d is your active work; cooking, heating, chilling or overnight soaking can take longer. Ready-cooked chicken, bought soup, frozen vegetables, supermarket meals and partner-prepared food are legitimate options. Follow product storage, use-by and heating directions.\u003c/p>\n\u003ch3>Supplements, without the pile-on\u003c/h3>\n\u003cul>\n\u003cli>\u003cb>Iodine:\u003c/b> Australian guidance recommends a supplement containing \u003cb>150 micrograms daily while breastfeeding\u003c/b>. Check whether a current product already supplies it. If you have a pre-existing thyroid condition, seek medical advice before taking one. \u003ca href=\"https://www.nhmrc.gov.au/about-us/publications/iodine-supplementation-pregnant-and-breastfeeding-women\" target=\"_blank\" rel=\"noopener\">NHMRC recommendation\u003c/a>.\u003c/li>\n\u003cli>\u003cb>Iron:\u003c/b> known low iron/anaemia, blood loss and discharge advice need individual review. Do not automatically add high-dose iron or change prescribed treatment. \u003ca href=\"https://www1.racgp.org.au/ajgp/2022/march/postpartum-nutrition-guidance-for-gps\" target=\"_blank\" rel=\"noopener\">GP nutrition guidance\u003c/a>.\u003c/li>\n\u003cli>\u003cb>B12 and vitamin D:\u003c/b> B12 is particularly important with vegan or very low-animal-food diets; vitamin D supplementation may be needed with limited sun exposure or deficiency risk. Doses depend on individual advice, not a swipe result. \u003ca href=\"https://www.breastfeeding.asn.au/resources/breastmilk-composition\" target=\"_blank\" rel=\"noopener\">ABA nutrient guidance\u003c/a>.\u003c/li>\n\u003cli>\u003cb>Calcium and omega-3:\u003c/b> start with suitable foods, and review gaps before adding pills. Plant-product fortification varies; read labels.\u003c/li>\n\u003cli>\u003cb>Check overlapping products:\u003c/b> multivitamin, B-complex and magnesium products can overlap. Supplemental B6 can cause nerve damage, particularly when products are combined. \u003ca href=\"https://www.tga.gov.au/safety/safety-monitoring-and-information/safety-alerts/health-supplements-containing-vitamin-b6-can-cause-peripheral-neuropathy\" target=\"_blank\" rel=\"noopener\">TGA advice\u003c/a>.\u003c/li>\n\u003c/ul>\n\u003ch3>No milk-boost promises\u003c/h3>\n\u003cp>Food supports maternal nutrition, but these cards do not promise extra pumped milk. \u201cLactation\u201d foods and herbs are not default treatments; evidence is limited and herbs can interact with medicines. \u003ca href=\"https://www.breastfeeding.asn.au/resources/galactagogues-substances-used-increase-supply\" target=\"_blank\" rel=\"noopener\">ABA evidence overview\u003c/a>.\u003c/p>\n\u003cp class=\"credit\">General adult food and maternal breastfeeding information, not a diagnosis, personalised supplement regimen or infant supplement plan. Recipe amounts and prep times are author estimates; food photos illustrate ideas and may show extras. Check exact ingredient labels and allergies. Baby feeding/growth or maternal recovery concerns belong with the appropriate clinician.\u003c/p>\n";</script><script>(() => {
  'use strict';
  const C = window.MenuCore;
  const KEY = 'snack-match-twenty-v2';
  const $ = selector => document.querySelector(selector);
  const esc = value => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
  const image = food => window.PHOTOS[food.image - 1].data;
  let state = C.makeState();
  let view = 'discover';
  let menuTab = 'menu';
  let saveWorks = true;
  let busy = false;
  try { const stored = localStorage.getItem(KEY); if (stored) state = C.readState(stored); } catch (_) { saveWorks = false; }
  if (state.paused) view = 'picks';
  const likes = () => C.FOODS.filter(food => state.decisions[food.id] === 'yes');
  function toast(message) { const node = $('#toast'); node.textContent = message; node.classList.add('show'); clearTimeout(toast.timer); toast.timer = setTimeout(() => node.classList.remove('show'), 1900); }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); saveWorks = true; } catch (_) { saveWorks = false; toast('Storage unavailable. Download your picks to keep them.'); } }
  function navigate(next) { view = next; render(); window.scrollTo(0, 0); }
  function resume() { state.paused = false; save(); navigate('discover'); }
  function continueButton() { return state.cursor < C.FOODS.length ? `<button class="button primary wide continue-button" data-action="continue">Continue choosing →</button>` : ''; }
  function headers(title, subtitle) { return `<h1>${title}</h1><p class="sub">${subtitle}</p>`; }
  function footer() { return `<p class="concept-note">${C.FOODS.length} food ideas · <button class="text-button" data-action="credits">photo credits</button></p>`; }
  function discover() {
    if (state.cursor >= C.FOODS.length) return headers('Good taste. Less thinking.', 'Your yeses are saved. No need to pick everything.') + `<section class="empty fade"><div class="success-mark">✓</div><h2>${likes().length} food${likes().length === 1 ? '' : 's'} you would eat</h2><p>Turn your picks into a small menu.<br>Repeat the good stuff. Skip the faff.</p><button class="button primary wide" data-action="menu">See my menu & list</button><button class="button secondary wide share-action" data-action="share">Share my results</button><button class="text-button" data-action="review">Look through the photos again</button></section>` + footer();
    const food = C.FOODS[state.cursor];
    return headers('What sounds good?', 'Pick with your eyes. We will sort the list.') + `<div class="deck-top"><span>${state.cursor + 1} of ${C.FOODS.length} ideas</span><button class="deck-pause" data-action="pause">Save & pause</button></div><div class="progress-track" aria-hidden="true"><i style="width:${((state.cursor + 1) / C.FOODS.length) * 100}%"></i></div><article class="food-card fade" id="food-card" data-food="${food.id}"><div class="photo-wrap"><img class="hero" src="${image(food)}" alt="${esc(food.name)} — example food photo" draggable="false"><span class="category-chip">${food.category}</span></div><div class="card-body"><h2>${esc(food.name)}</h2><div class="prep-line"><b>◷ ${food.prep}</b><span class="dot">●</span><span>${esc(food.effort)}</span></div><button class="ingredients-link" data-details="${food.id}">What's in it?</button></div></article><div class="actions"><button class="button secondary" id="pass" data-choice="no"><span class="action-symbol" aria-hidden="true">×</span>No thanks</button><button class="button primary" id="like" data-choice="yes"><span class="action-symbol" aria-hidden="true">♡</span>Yes please</button></div><p class="gesture-hint">Swipe left to pass · right to save</p>`;
  }
  function picks() {
    const chosen = likes();
    let html = headers('Your kind of food.', `${chosen.length} saved ${chosen.length === 1 ? 'idea' : 'ideas'}. Nothing locked in.`) + continueButton();
    if (!chosen.length) html += `<section class="empty"><div class="big">♡</div><h2>Your picks start here.</h2><p>Like a food photo and it will appear here.</p><button class="button primary" data-action="discover">Find something good</button></section>`;
    else html += chosen.map(food => `<article class="pick-row"><img src="${image(food)}" alt="${esc(food.name)}"><div><h2>${esc(food.name)}</h2><p>${food.prep} · ${food.category}</p></div><button class="remove" data-remove="${food.id}" aria-label="Remove ${esc(food.name)}">×</button></article>`).join('') + `<button class="button primary wide" style="margin-top:22px" data-action="menu">Make my menu & shopping list →</button>`;
    html += `<button class="button secondary wide share-action" data-action="share">Share my results</button><div class="section-actions"><button class="button secondary small" data-action="backup">Download picks</button><button class="button secondary small" data-action="import">Restore picks</button></div><p class="small-note">${saveWorks ? 'Saved in this browser. Download a backup to move your picks to another device.' : 'Browser storage is unavailable. Download a backup before closing.'}</p>` + footer();
    return html;
  }
  function menu() {
    const plan = C.makePlan(state.decisions);
    const filled = plan.filter(slot => slot.foodId).length;
    const missing = plan.length - filled;
    let html = headers('From “yes” to sorted.', 'A 3-day draft, made only from your picks.') + `<div class="mini-tabs" role="group" aria-label="Menu or shopping list"><button id="menu-tab" class="${menuTab === 'menu' ? 'active' : ''}" data-menu-tab="menu">Your menu</button><button id="shopping-tab" class="${menuTab === 'shopping' ? 'active' : ''}" data-menu-tab="shopping">Shopping list</button></div>`;
    html += '<p class="small-note">This is a starting menu, not a daily food limit. Add portions or snacks to suit hunger and needs.</p>' + continueButton();
    if (!filled) return html + `<section class="empty"><h2>A menu needs a few yeses.</h2><p>Nothing will be added that you did not pick.</p><button class="button primary" data-action="discover">Choose some food</button></section>` + footer();
    if (missing) html += `<div class="notice">${missing} open ${missing === 1 ? 'slot' : 'slots'}: choose more food or fill these in yourself. We have not guessed.</div>`;
    if (menuTab === 'menu') {
      for (let day = 1; day <= 3; day += 1) {
        html += `<section class="day-card"><p class="day-label">Day ${day}</p>`;
        html += plan.filter(slot => slot.day === day).map(slot => {
          const food = C.FOODS.find(f => f.id === slot.foodId);
          return `<div class="meal">${food ? `<img src="${image(food)}" alt="">` : '<div class="missing-icon">+</div>'}<div><span>${slot.category}</span><b>${food ? esc(food.name) : `Pick a ${slot.category}`}</b></div></div>`;
        }).join('');
        html += '</section>';
      }
      html += '<button class="button primary wide" data-menu-tab="shopping">Get my shopping list →</button>';
    } else {
      const list = C.shoppingFor(plan);
      let aisle = '';
      html += '<p class="small-note">Tick what you already have. Quantities are for this draft, not every saved idea. Round up to store pack sizes as needed.</p><div id="shopping-items">';
      for (const item of list) {
        const key = `${item.id}:${item.unit}`;
        if (item.aisle !== aisle) { aisle = item.aisle; html += `<div class="shopping-head"><h3>${aisle}</h3></div>`; }
        html += `<label class="shop-row ${state.pantry.includes(key) ? 'done' : ''}"><input type="checkbox" data-pantry="${key}" aria-label="Already have ${esc(item.name)}" ${state.pantry.includes(key) ? 'checked' : ''}><span class="shop-name">${esc(item.name)}</span><span class="qty" data-ingredient="${item.id}">${C.formatQuantity(item)}</span></label>`;
      }
      html += '</div><button class="button primary wide" style="margin-top:23px" data-action="shopping-download">Download shopping list</button>';
    }
    html += '<p class="small-note">This is an example menu, not a prescribed diet or a full nutrition assessment. Portions are illustrative; add or change food to suit your needs. Check ingredients and product labels for allergies. Photos show the idea, not exact shopping quantities.</p>' + footer();
    return html;
  }
  function render() {
    $('#view').innerHTML = view === 'picks' ? picks() : view === 'menu' ? menu() : discover();
    $('#view').insertAdjacentHTML('beforeend', '<div class="section-actions"><button class="button secondary small reset-picks" data-action="reset">Reset picks</button></div>');
    $('#like-count').textContent = String(likes().length);
    $('#undo').disabled = !state.history.length;
    document.querySelectorAll('.bottom-nav button').forEach(button => { button.classList.toggle('active', button.dataset.view === view); button.setAttribute('aria-current', button.dataset.view === view ? 'page' : 'false'); });
    if (view === 'discover') bindSwipe();
  }
  function choose(choice) {
    if (busy || state.cursor >= C.FOODS.length) return;
    const food = C.FOODS[state.cursor];
    state.history.push({ id: food.id, choice, previous: state.decisions[food.id], index: state.cursor });
    state.history = state.history.slice(-500);
    state.decisions[food.id] = choice;
    state.cursor += 1;
    save(); render();
  }
  function undo() {
    const last = state.history.pop(); if (!last) return;
    if (last.previous === undefined) delete state.decisions[last.id]; else state.decisions[last.id] = last.previous;
    state.cursor = last.index; state.paused = false; view = 'discover'; save(); render(); toast('Last choice undone.');
  }
  function bindSwipe() {
    const card = $('#food-card'); if (!card) return;
    let start = null;
    card.addEventListener('pointerdown', event => { if (event.target.closest('button')) return; start = { x: event.clientX, y: event.clientY }; card.setPointerCapture(event.pointerId); });
    card.addEventListener('pointermove', event => { if (!start) return; const dx = event.clientX - start.x; const dy = event.clientY - start.y; if (Math.abs(dx) > Math.abs(dy) + 8) card.style.transform = `translateX(${dx * .25}px) rotate(${dx * .025}deg)`; });
    card.addEventListener('pointerup', event => { if (!start) return; const dx = event.clientX - start.x; const dy = event.clientY - start.y; start = null; card.style.transform = ''; if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.4) choose(dx > 0 ? 'yes' : 'no'); });
    card.addEventListener('pointercancel', () => { start = null; card.style.transform = ''; });
  }
  function download(name, content, type) {
    const url = URL.createObjectURL(new Blob([content], { type }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function details(id) {
    const food = C.FOODS.find(f => f.id === id); if (!food) return;
    const timing = Number.isFinite(food.activeMinutes) ? `<p class="small-note">About ${food.activeMinutes} min hands-on · ${food.totalMinutes >= 120 ? (food.totalMinutes / 60) + ' hours including waiting' : food.totalMinutes + ' min until ready'}. Author estimates; check the prep note and product instructions.</p>` : '';
    const groups = food.foodGroups && food.foodGroups.length ? `<h3>Food groups in this idea</h3><p>${food.foodGroups.map(esc).join(' · ')}. This is ingredient-based, not a measured nutrient or milk-supply score.</p>` : '';
    $('#dialog-content').innerHTML = `<p class="eyebrow">${food.category} · ${food.prep}</p><h2>${esc(food.name)}</h2><p>${esc(food.note)}</p>${timing}${groups}<h3>A suggested version</h3><ul>${food.ingredients.map(item => `<li>${esc(item.name)} — ${C.formatQuantity(item)}</li>`).join('')}</ul><h3>Allergen checks</h3><p>${food.allergens.map(esc).join('; ')}. Check the exact product labels, including cross-contact.</p><p class="credit">The photo illustrates the food idea; pictured extras, recipe and portion may differ. These are not prescribed serving sizes.</p>`;
    $('#details').showModal();
  }
  function credits() {
    $('#dialog-content').innerHTML = `<h2>Real food. Real photos.</h2><p class="small-note">Existing licensed photographs, resized for this ${C.FOODS.length}-image food test. The photo is inspiration; it is not an exact recipe or an allergy guarantee.</p>` + window.PHOTOS.map((photo, i) => `<p class="credit"><b>${i + 1}. ${esc(photo.title.replace('File:', ''))}</b><br>${esc(photo.artist)} · <a href="${esc(photo.licence_url)}" target="_blank" rel="noopener">${esc(photo.licence)}</a> · <a href="${esc(photo.page)}" target="_blank" rel="noopener">Source</a></p>`).join('') + '<p class="credit">Share-alike licences continue to apply to the relevant adapted image assets.</p>';
    $('#details').showModal();
  }
  function nutritionNotes() { $('#dialog-content').innerHTML = window.NUTRITION_NOTES; $('#details').showModal(); }
  async function shareResults() {
    const text = C.shareSummary(state.decisions);
    if (typeof navigator.share === 'function') {
      try { await navigator.share({ title: 'My Snack Match picks', text }); return; }
      catch (error) { if (error && error.name === 'AbortError') return; }
    }
    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
      try { await navigator.clipboard.writeText(text); toast('Results copied. Paste them into our chat.'); return; }
      catch (_) { /* A restrictive viewer may block clipboard permission. */ }
    }
    download('snack-match-picks.json', JSON.stringify(state, null, 2), 'application/json');
    toast('Picks downloaded. Send that file back in our chat.');
  }
  document.addEventListener('click', event => {
    const choice = event.target.closest('[data-choice]'); if (choice) return choose(choice.dataset.choice);
    const nav = event.target.closest('[data-view]'); if (nav) return nav.dataset.view === 'discover' ? resume() : navigate(nav.dataset.view);
    const info = event.target.closest('[data-details]'); if (info) return details(info.dataset.details);
    const tab = event.target.closest('[data-menu-tab]'); if (tab) { menuTab = tab.dataset.menuTab; render(); return; }
    const remove = event.target.closest('[data-remove]'); if (remove) { state.decisions[remove.dataset.remove] = 'no'; save(); render(); return; }
    const action = event.target.closest('[data-action]'); if (!action) return;
    switch (action.dataset.action) {
      case 'reset':
        if (!window.confirm('Reset all picks? This clears your yes/no choices, progress and shopping ticks on this browser. Download your picks first if you want a backup.')) return;
        state = C.makeState(); menuTab = 'menu'; busy = false;
        save(); navigate('discover'); toast('Picks cleared. Ready to start again.'); return;
      case 'continue': return resume();
      case 'pause': state.paused = true; save(); return navigate('picks');
      case 'share': return shareResults();
      case 'menu': return navigate('menu');
      case 'discover': return resume();
      case 'review': state.cursor = 0; state.paused = false; save(); return navigate('discover');
      case 'credits': return credits();
      case 'backup': return download('snack-match-picks.json', JSON.stringify(state, null, 2), 'application/json');
      case 'import': return $('#import-file').click();
      case 'shopping-download': {
        const list = C.shoppingFor(C.makePlan(state.decisions)).filter(item => !state.pantry.includes(`${item.id}:${item.unit}`));
        const lines = ['SNACK MATCH — SHOPPING LIST', 'For the selected 3-day example menu. Check quantities, allergies and pack sizes.', '', ...list.map(item => `${item.aisle}\t${item.name}\t${C.formatQuantity(item)}`)];
        return download('snack-match-shopping.txt', lines.join('\n'), 'text/plain');
      }
    }
  });
  document.addEventListener('change', event => {
    if (!event.target.matches('[data-pantry]')) return;
    const key = event.target.dataset.pantry;
    state.pantry = event.target.checked ? [...new Set([...state.pantry, key])] : state.pantry.filter(item => item !== key);
    event.target.closest('.shop-row').classList.toggle('done', event.target.checked); save();
  });
  $('#import-file').addEventListener('change', async event => {
    const file = event.target.files[0]; if (!file) return;
    try { if (file.size > 100000) throw new Error('Backup file is too large.'); state = C.readState(await file.text()); save(); navigate('picks'); toast('Your picks are restored.'); } catch (_) { toast('That backup could not be read. Your current picks are unchanged.'); }
    event.target.value = '';
  });
  $('#nutrition-info').addEventListener('click', nutritionNotes);
  $('#undo').addEventListener('click', undo);
  $('#close-dialog').addEventListener('click', () => $('#details').close());
  $('#brand').addEventListener('click', event => { event.preventDefault(); resume(); });
  document.addEventListener('keydown', event => { if ($('#details').open || view !== 'discover' || event.target.matches('input,textarea,select,button,a')) return; if (event.key === 'ArrowRight') choose('yes'); if (event.key === 'ArrowLeft') choose('no'); });
  render();
  document.documentElement.dataset.appReady = 'true';
  document.querySelectorAll('.bottom-nav button').forEach(button => { button.disabled = false; });
  window.SnackMatchProof = { getState: () => JSON.parse(JSON.stringify(state)), getPlan: () => C.makePlan(state.decisions), getShopping: () => C.shoppingFor(C.makePlan(state.decisions)) };
})();
</script>
</body>
</html>
